[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "minigng"
authors = [
    {name = "Elio Ventocilla"},
]
version = "0.0.3"
description = "A minimum implementation of the Growing Neural Gas"
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["clustering", "growing-neural-gas", "machine-learning", "neural-gas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.2.3",
]

[project.urls]
Homepage = "https://github.com/eliovr/minigng"
Repository = "https://github.com/eliovr/minigng"
Issues = "https://github.com/eliovr/minigng/issues"

[project.optional-dependencies]
example = [
    "matplotlib>=3.10.1",
    "networkx>=3.4.2",
    "pandas>=2.2.3",
    "pydot>=3.0.4",
    "scipy>=1.15.2",
]
test = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["minigng"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest-cov>=7.1.0",
]
